<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha - Laços</title>
  <style>
    :root{--gold:#a78345;--gold-dark:#806233;--ink:#292b2c;--muted:#81847e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7f6f2,#ece7da);padding:20px}.card{width:min(420px,100%);background:#fff;border-radius:16px;padding:32px;box-shadow:0 18px 50px rgba(54,48,35,.12)}.brand{width:44px;height:44px;margin-bottom:14px;border-radius:12px;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:24px}h1{margin:0 0 6px;font-size:22px}.subtitle{margin:0 0 22px;color:var(--muted);font-size:13px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:700}.field input{height:43px;border:1px solid #e3e4e0;border-radius:7px;padding:0 12px;font:inherit}.actions{display:flex;justify-content:flex-end;margin-top:18px}button{height:43px;border:0;border-radius:7px;background:var(--gold);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}#status{min-height:18px;margin:14px 0 0;color:var(--muted);font-size:12px}.error{color:#a45d55!important}.success{color:#5f7e64!important}@media(max-width:480px){.card{padding:24px 20px}}
  </style>
</head>
<body>
<main class="card">
  <div class="brand">♡</div>
  <h1>Redefinir senha</h1>
  <p class="subtitle">Informe uma nova senha para recuperar o acesso à sua conta.</p>
  <form id="reset-form">
    <div class="field"><label for="password">Nova senha</label><input id="password" name="password" type="password" minlength="8" maxlength="100" required autocomplete="new-password"></div>
    <div class="field"><label for="confirmation">Confirme a nova senha</label><input id="confirmation" name="confirmation" type="password" minlength="8" maxlength="100" required autocomplete="new-password"></div>
    <div class="actions"><button id="submit" type="submit">Salvar nova senha</button></div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('reset-form');
  const status = document.getElementById('status');
  const submit = document.getElementById('submit');

  if (!token) {
    status.textContent = 'Link inválido. Solicite uma nova redefinição de senha.';
    status.className = 'error';
    submit.disabled = true;
  }

  form.addEventListener('submit', async event => {
    event.preventEventDefault?.();
    event.preventDefault();
    const newPassword = document.getElementById('password').value;
    const confirmation = document.getElementById('confirmation').value;

    if (newPassword !== confirmation) {
      status.textContent = 'As senhas não conferem.';
      status.className = 'error';
      return;
    }

    submit.disabled = true;
    status.textContent = 'Salvando...';
    status.className = '';
    try {
      const response = await fetch('/api/users/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, newPassword })
      });
      const result = await response.json();
      status.textContent = response.ok ? result.message : (result.detail || result.message || 'Não foi possível redefinir a senha.');
      status.className = response.ok ? 'success' : 'error';
      if (response.ok) {
        form.reset();
        setTimeout(() => location.href = '/#/login', 1200);
      } else submit.disabled = false;
    } catch {
      status.textContent = 'Não foi possível conectar ao servidor.';
      status.className = 'error';
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
