<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir senha - GerenciadorPet</title>
</head>
<body>
<main>
    <h1>Redefinir senha</h1>
    <p>Informe sua nova senha. O link recebido por e-mail expira em 15 minutos.</p>
    <form id="reset-form">
        <label for="password">Nova senha</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="100" required
               autocomplete="new-password">

        <label for="confirmation">Confirme a nova senha</label>
        <input id="confirmation" name="confirmation" type="password" minlength="8" maxlength="100" required
               autocomplete="new-password">

        <button id="submit" type="submit">Salvar nova senha</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
    const token = new URLSearchParams(window.location.search).get("token");
    const form = document.getElementById("reset-form");
    const status = document.getElementById("status");
    const submit = document.getElementById("submit");

    if (!token) {
        status.textContent = "Link inválido. Solicite uma nova redefinição de senha.";
        submit.disabled = true;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("password").value;
        const confirmation = document.getElementById("confirmation").value;

        if (newPassword !== confirmation) {
            status.textContent = "As senhas não conferem.";
            return;
        }

        submit.disabled = true;
        status.textContent = "Salvando...";
        try {
            const response = await fetch("/api/users/reset-password", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({token, newPassword})
            });
            const result = await response.json();
            status.textContent = response.ok
                ? result.message
                : (result.detail || result.message || "Não foi possível redefinir a senha.");
            if (response.ok) {
                form.reset();
            } else {
                submit.disabled = false;
            }
        } catch {
            status.textContent = "Não foi possível conectar ao servidor. Tente novamente.";
            submit.disabled = false;
        }
    });
</script>
</body>
</html>
