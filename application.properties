spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

app.jwt.secret=${JWT_SECRET}
app.mail.from=${MAILTRAP_FROM:noreply@gerenciadorpet.local}
app.frontend.password-reset-url=${FRONTEND_PASSWORD_RESET_URL:http://localhost:8081/reset-password.html}

spring.datasource.url=jdbc:mysql://localhost:3306/db_pets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
